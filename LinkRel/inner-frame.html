<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inner Frame</title>

  <style>
    body {
      background-color: lightyellow;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    a {
      display: block;
      width: 220px;
      margin: 10px 0;
      padding: 10px;
      background-color: white;
      border: 2px solid black;
      color: black;
      text-decoration: none;
    }

    a:hover {
      background-color: lightgray;
    }
  </style>
</head>

<body>
  <h3>INNER IFRAME: inner-frame.html</h3>

  <p>
    Yellow background means you are inside the nested iframe.
  </p>

  <a href="destination.html" target="_self">
    Open with _self
  </a>

  <a href="destination.html" target="_parent">
    Open with _parent
  </a>

  <a href="destination.html" target="_top">
    Open with _top
  </a>

  <a href="destination.html" target="_blank">
    Open with _blank
  </a>
</body>
</html>
