<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Iframe Page</title>
</head>
<body>
  <h2>This page is inside an iframe</h2>

  <p>
    <a href="result.html" target="_self">
      Open with _self
    </a>
  </p>

  <p>
    <a href="result.html" target="_parent">
      Open with _parent
    </a>
  </p>

  <p>
    <a href="result.html" target="_top">
      Open with _top
    </a>
  </p>

  <p>
    <a href="result.html" target="_blank">
      Open with _blank
    </a>
  </p>
</body>
</html>
